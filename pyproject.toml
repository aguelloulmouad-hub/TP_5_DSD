[project]
name = "ai-agentic-gemini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mouad Aguelloul", email = "aguelloulmouad@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.1",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-agentic-gemini = "ai_agentic_gemini:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
